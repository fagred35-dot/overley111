[package]
name = "overley-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Overley hub: exe-окно на Tauri 2 (WebView2, без Electron) + ядро оверлея в том же процессе"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
overlay-win = { path = "../overlay-win" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# hub — сам себе корень workspace (исключён из workspace спайка)
[workspace]
